<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trái Tim Đỏ Hoa Hồng - Huuduong</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050205;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        /* Màn hình chờ */
        #welcome-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a0812 0%, #050205 100%);
            z-index: 10;
            transition: opacity 1s ease;
        }

        .welcome-content {
            text-align: center;
            padding: 20px;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .welcome-badge {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ff5c8a;
            border: 1px solid rgba(255, 92, 138, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 25px;
            background: rgba(255, 92, 138, 0.05);
        }

        .welcome-title {
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 77, 109, 0.4);
        }

        .start-btn {
            background: linear-gradient(135deg, #ff1744 0%, #d81b60 100%);
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 23, 68, 0.6);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 45px rgba(255, 23, 68, 0.9);
        }

        .signature {
            position: absolute;
            bottom: 30px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1.5px;
        }

        /* Chú thích hướng dẫn xoay */
        #rotate-hint {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 5;
            display: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- Màn hình chờ -->
    <div id="welcome-screen">
        <div class="welcome-content">
            <div class="welcome-badge">3D Rose Particle Experience</div>
            <div class="welcome-title">Trái Tim Đỏ Hoa Hồng</div>
            <button class="start-btn" id="startBtn">
                <span>❤️</span> BẮT ĐẦU
            </button>
        </div>
        <div class="signature">Source code created by Huuduong</div>
    </div>

    <!-- Hướng dẫn tương tác -->
    <div id="rotate-hint">Chạm hoặc vuốt để xoay trái tim 3D</div>

    <!-- Canvas chính cho hiệu ứng 3D -->
    <canvas id="canvas3d"></canvas>

    <script>
        const startBtn = document.getElementById('startBtn');
        const welcomeScreen = document.getElementById('welcome-screen');
        const canvas = document.getElementById('canvas3d');
        const rotateHint = document.getElementById('rotate-hint');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio phát nhạc nền nhẹ nhàng (Web Audio API)
        let audioCtx = null;
        let isPlaying = false;

        function startMusic() {
            if (isPlaying) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                isPlaying = true;
                playNoteLoop();
            } catch(e) {
                console.log("Audio not supported");
            }
        }

        function playNoteLoop() {
            if (!isPlaying || !audioCtx) return;
            const notes = [261.63, 329.63, 392.00, 523.25, 587.33, 659.25]; // C E G C5 D5 E5
            const note = notes[Math.floor(Math.random() * notes.length)];
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(note, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 3);

            setTimeout(playNoteLoop, 1200);
        }

        // Bắt sự kiện nhấn Bắt Đầu
        startBtn.addEventListener('click', () => {
            startMusic();
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                canvas.style.display = 'block';
                rotateHint.style.display = 'block';
                initSimulation();
            }, 1000);
        });

        // 3D Simulation Logic
        function initSimulation() {
            let particles = [];
            let streams = [];
            let rings = [];

            let rotationX = 0;
            let rotationY = 0;
            let targetRotationX = 0;
            let targetRotationY = 0;
            let isDragging = false;
            let startX, startY;

            // Tạo hình khối trái tim 3D
            for (let i = 0; i < 9000; i++) {
                let t = Math.random() * Math.PI * 2;
                let u = Math.random() * Math.PI;
                
                // Công thức tạo hình trái tim 3D
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                let z = (Math.random() - 0.5) * 10;

                let scale = Math.min(width, height) / 38;
                particles.push({
                    x: x * scale,
                    y: y * scale,
                    z: z * scale,
                    ox: x * scale,
                    oy: y * scale,
                    oz: z * scale,
                    color: x < 0 ? '#ff1744' : '#ff80ab', // Đỏ hoa hồng và hồng ánh sáng
                    size: Math.random() * 2 + 1
                });
            }

            // Vòng xoáy năng lượng dưới đáy
            for (let i = 0; i < 60; i++) {
                rings.push({
                    angle: Math.random() * Math.PI * 2,
                    radius: 50 + Math.random() * 120,
                    speed: 0.02 + Math.random() * 0.03,
                    yOffset: 220 + Math.random() * 30
                });
            }

            // Luồng sáng bùng nổ tự động mỗi 3 giây
            function triggerBurst() {
                for (let i = 0; i < 40; i++) {
                    streams.push({
                        x: (Math.random() - 0.5) * 200,
                        y: 220,
                        z: (Math.random() - 0.5) * 100,
                        vx: (Math.random() - 0.5) * 4,
                        vy: -6 - Math.random() * 6,
                        vz: (Math.random() - 0.5) * 4,
                        life: 1,
                        color: Math.random() > 0.5 ? '#ff1744' : '#ff80ab'
                    });
                }
            }

            // Kích hoạt tự động mỗi 3 giây
            setInterval(triggerBurst, 3000);
            triggerBurst(); // Chạy ngay 1 đợt đầu tiên

            // Tương tác vuốt/xoay 3D
            window.addEventListener('mousedown', e => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
            });

            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                let dx = e.clientX - startX;
                let dy = e.clientY - startY;
                targetRotationY += dx * 0.005;
                targetRotationX += dy * 0.005;
                startX = e.clientX;
                startY = e.clientY;
            });

            window.addEventListener('mouseup', () => isDragging = false);

            // Touch support cho điện thoại
            window.addEventListener('touchstart', e => {
                if(e.touches.length === 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }
            });

            window.addEventListener('touchmove', e => {
                if (!isDragging || e.touches.length !== 1) return;
                let dx = e.touches[0].clientX - startX;
                let dy = e.touches[0].clientY - startY;
                targetRotationY += dx * 0.005;
                targetRotationX += dy * 0.005;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchend', () => isDragging = false);

            // Vòng lặp Render 3D
            function animate() {
                ctx.fillStyle = 'rgba(5, 2, 5, 0.25)';
                ctx.fillRect(0, 0, width, height);

                // Tự động xoay nhẹ nếu không tương tác
                if (!isDragging) {
                    targetRotationY += 0.008;
                }

                rotationX += (targetRotationX - rotationX) * 0.1;
                rotationY += (targetRotationY - rotationY) * 0.1;

                let cx = width / 2;
                let cy = height / 2 - 20;

                // Vẽ đế vòng xoáy năng lượng
                ctx.save();
                ctx.translate(cx, cy + 180);
                rings.forEach(r => {
                    r.angle += r.speed;
                    let rx = Math.cos(r.angle) * r.radius;
                    let rz = Math.sin(r.angle) * (r.radius * 0.3);
                    let scale = 300 / (300 + rz);
                    
                    ctx.beginPath();
                    ctx.arc(rx * scale, 0, 2 * scale, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 23, 68, 0.6)';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ff1744';
                    ctx.fill();
                });
                ctx.restore();

                // Cập nhật và vẽ luồng sáng bùng nổ bay lên
                streams.forEach((s, index) => {
                    s.x += s.vx;
                    s.y += s.vy;
                    s.z += s.vz;
                    s.life -= 0.015;

                    if (s.life <= 0) {
                        streams.splice(index, 1);
                        return;
                    }

                    // Phép chiếu 3D sang 2D
                    let x = s.x;
                    let y = s.y;
                    let z = s.z;

                    // Xoay trục Y
                    let x1 = x * Math.cos(rotationY) + z * Math.sin(rotationY);
                    let z1 = -x * Math.sin(rotationY) + z * Math.cos(rotationY);
                    // Xoay trục X
                    let y2 = y * Math.cos(rotationX) - z1 * Math.sin(rotationX);
                    let z2 = y * Math.sin(rotationX) + z1 * Math.cos(rotationX);

                    let perspective = 400 / (400 + z2);
                    let px = cx + x1 * perspective;
                    let py = cy + y2 * perspective;

                    ctx.beginPath();
                    ctx.arc(px, py, 2.5 * perspective, 0, Math.PI * 2);
                    ctx.fillStyle = s.color;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#ff1744';
                    ctx.globalAlpha = s.life;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                });

                // Vẽ trái tim 3D hạt sao
                let time = Date.now() * 0.003;
                let heartbeat = 1 + Math.sin(time * 3) * 0.04; // Hiệu ứng nhịp đập

                particles.forEach(p => {
                    let x = p.ox * heartbeat;
                    let y = p.oy * heartbeat;
                    let z = p.oz * heartbeat;

                    // Xoay trục Y
                    let x1 = x * Math.cos(rotationY) + z * Math.sin(rotationY);
                    let z1 = -x * Math.sin(rotationY) + z * Math.cos(rotationY);
                    // Xoay trục X
                    let y2 = y * Math.cos(rotationX) - z1 * Math.sin(rotationX);
                    let z2 = y * Math.sin(rotationX) + z1 * Math.cos(rotationX);

                    let perspective = 450 / (450 + z2);
                    let px = cx + x1 * perspective;
                    let py = cy + y2 * perspective;

                    let alpha = (z2 + 200) / 400;
                    if (alpha < 0.1) alpha = 0.1;
                    if (alpha > 1) alpha = 1;

                    ctx.beginPath();
                    ctx.arc(px, py, p.size * perspective, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = '#ff4081';
                    ctx.globalAlpha = alpha;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                });

                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>
</body>
</html>
